<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cacamochi — Refonte Fun Loop</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <img src="img/header/logo_cacamochi.png" alt="Cacamochi" />
        <div>
          <p class="kicker">Refonte Totale</p>
          <h1>Nursery des Cacasauvages</h1>
        </div>
      </div>
      <div class="currencies">
        <span class="chip">🪙 <strong id="coins">0</strong></span>
        <span class="chip">⭐ <strong id="stars">0</strong></span>
        <span class="chip">📅 Jour <strong id="day">1</strong></span>
      </div>
    </header>

    <main class="layout">
      <section class="pet-panel card">
        <div class="pet-scene" id="petScene">
          <img src="img_background.jpg" alt="Décor" class="scene-bg" />
          <img id="petImage" src="img_bouseau.png" alt="Cacamochi" class="pet-sprite" />
          <div class="pet-status" id="petMood">Prêt pour l'aventure ✨</div>
          <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
        </div>

        <div class="pet-meta">
          <h2 id="petName">Bouseau Rookie</h2>
          <p id="petRank">Rang: Rookie des égouts • Niveau 1</p>
          <div class="xp-row">
            <span>Progression</span>
            <div class="meter"><i id="xpBar"></i></div>
            <span id="xpText">0 / 100 XP</span>
          </div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>
      </section>

      <section class="control-panel">
        <article class="card">
          <h3>Actions rapides</h3>
          <div class="actions" id="actions"></div>
        </article>

        <article class="card">
          <div class="section-head">
            <h3>Missions du jour</h3>
            <button id="rerollMission" class="small-btn" type="button">Nouvelle mission</button>
          </div>
          <ul class="mission-list" id="missionList"></ul>
        </article>

        <article class="card">
          <h3>Ateliers</h3>
          <div class="minigames" id="minigames"></div>
          <div class="arena hidden" id="arena">
            <div class="arena-head">
              <h4 id="arenaTitle">Mini-jeu</h4>
              <span id="arenaTimer">20s</span>
            </div>
            <p id="arenaGoal">Clique les bonus à temps !</p>
            <div class="arena-play" id="arenaPlay"></div>
            <button id="quitArena" class="small-btn" type="button">Quitter</button>
          </div>
        </article>

        <article class="card">
          <h3>Boutique</h3>
          <div class="shop" id="shop"></div>
        </article>

        <article class="card">
          <h3>Journal de nursery</h3>
          <ul class="log" id="log"></ul>
        </article>
      </section>
    </main>
  </div>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
